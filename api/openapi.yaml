            type: type
            body: body
            in_reply_to: in_reply_to
          - publisher_id: publisher_id
            offset: 0
            updated_at: 2000-01-23T04:56:07.000+00:00
            payload: ""
            parts:
            - text: text
              state: streaming
              type: thinking
            - text: text
              state: streaming
              type: thinking
            created_at: 2000-01-23T04:56:07.000+00:00
            stop_reason: end_turn
            message_id: message_id
            state: streaming
            type: type
            body: body
            in_reply_to: in_reply_to
          has_more: true
          next_since: next_since
        success: true
    RegisterTaskWebhookRequest:
      example:
        secret: secret
        url: https://openapi-generator.tech
        token: token
      properties:
        url:
          description: |
            Absolute HTTPS endpoint to POST callbacks to. The receiver
            gets the protocol-specific payload (OpenAPI: a task event
            envelope; A2A: JSON-RPC StreamResponse; MCP: notification).
          format: uri
          type: string
        token:
          description: |
            Optional bearer token sent as `Authorization: Bearer <token>`
            on each callback so the receiver can verify the call.
          type: string
        secret:
          description: |
            P2-A — HMAC-SHA256 signing key. When set, the deliverer
            signs every callback body and emits
            `X-BeeOS-Signature: t=<unix>,v1=<hex>` where
            `hex = hmac_sha256(secret, t || "." || body)`. The receiver
            should re-run the same HMAC to authenticate; mismatched
            timestamps (±5 min recommended tolerance) should be
            rejected to defend against replay.

            **Write-only**. Never echoed on Get / List responses; the
            `has_secret` boolean on `TaskWebhookResponse` is the only
            observable signal. Rotate by Set-ing a fresh value;
            passing `""` on update preserves the existing secret (use
            DELETE + re-register to clear).
          maxLength: 256
          minLength: 16
          type: string
      required:
      - url
    TaskWebhookResponse:
      allOf:
      - $ref: "#/components/schemas/SuccessEnvelope"
      - properties:
          data:
            $ref: "#/components/schemas/TaskWebhookResponse_allOf_data"
        required:
        - data
      example:
        data:
          has_secret: true
          webhook_id: webhook_id
          created_at: 2000-01-23T04:56:07.000+00:00
          task_id: task_id
          url: https://openapi-generator.tech
        success: true
    ListTaskWebhooksResponse:
      allOf:
      - $ref: "#/components/schemas/SuccessEnvelope"
      - properties:
          data:
            $ref: "#/components/schemas/ListTaskWebhooksResponse_allOf_data"
        required:
