components:
  responses:
    ControlActionOK:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object"
      description: |
        Standard `{ success, data }` envelope; `data` is an
        [`ActionResult`](#/components/schemas/ActionResult) (`{ ok: true }`)
        acknowledging the device action completed. Device-reported
        failures map to 400 `action_unsupported` / `invalid_param`,
        409 `device_busy`, 503 `device_offline`, or 504 `service_timeout`.
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Malformed request body, query parameter, or path parameter (`code`\
        \ is one of `invalid_json` / `invalid_body` / `invalid_param` / `missing_param`)."
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Missing or invalid `Authorization` header (`code` is one of `unauthorized`
        / `invalid_token` / `missing_token`).
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Caller doesn't own the resource. `code` is `forbidden`.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The agent / task / instance / conversation / webhook referenced
        doesn't exist or isn't visible to the caller. `code` is typically `agent_not_found`.
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |
        Resource is in a state that doesn't allow this operation. `code` is `conflict`.

        Two distinct cases for agent refusal:
        - **Legacy pre-output refused** (e.g. `agent_busy` from the agent runtime BEFORE any output is streamed): the gateway maps this to **409 Conflict** with `code = task_rejected`. No task body is produced.
        - **v3 in-band refused** (agent started a streaming reply, then transitioned the v3 envelope to `state = refused` with a refusal `body`): the invoke endpoint returns **200 OK** with `is_error = true` and the body carrying the refusal text. The terminal `stop_reason = refused` lets clients distinguish this from a successful completion. **NOT** a 409.

        Other 409 triggers: task already terminal, duplicate idempotency key on a changed payload.
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request body exceeds the per-route size limit (catalog/instances
        64 KiB; invoke/tasks 1 MiB; attachments must use file presign). `code` is
        `payload_too_large`.
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Per-caller × endpoint quota exceeded. `code` is `rate_limited`.
        Honour `Retry-After` if present.
    ServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |
        Server-side fault. `code` is one of:

        - `internal_error` (500) — unexpected
        - `agent_offline` / `agent_service_unavailable` (503) — agent or messaging
          subsystem unreachable
        - `auth_unavailable` / `auth_transient` (503) — Auth gRPC transient
        - `service_timeout` (504) — gateway gave up waiting for the agent

        See [docs/reference/errors.md](https://github.com/beeos-ai/beeos/blob/main/docs/reference/errors.md).
  schemas:
    SuccessEnvelope:
      properties:
        success:
          enum:
          - true
          type: boolean
      required:
      - success
    StringResponse:
      allOf:
      - $ref: "#/components/schemas/SuccessEnvelope"
      - properties:
