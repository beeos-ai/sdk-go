    ControlInfo:
      description: |
        Live control surface for an instance: online status, OS,
        current screen geometry, and the supported action verbs.
      example:
        current_app: current_app
        screen_width: 0
        screen_height: 6
        os: os
        coordinate_system: coordinate_system
        online: true
        supported_actions:
        - supported_actions
        - supported_actions
      properties:
        online:
          description: Whether the device is currently reachable for control.
          type: boolean
        os:
          description: "Device OS (e.g. `android`, `linux`, `windows`, `macos`)."
          type: string
        screen_width:
          description: Current screen width in device pixels.
          format: int32
          type: integer
        screen_height:
          description: Current screen height in device pixels.
          format: int32
          type: integer
        coordinate_system:
          description: Always `absolute_pixels` (origin top-left).
          type: string
        supported_actions:
          description: "Action verbs this device supports (e.g. `screenshot`, `tap`)."
          items:
            type: string
          type: array
        current_app:
          description: "Foreground app / window, when known."
          type: string
      required:
      - coordinate_system
      - online
      - os
      - screen_height
      - screen_width
      - supported_actions
      title: ControlInfo
    DeviceInfoDTO:
      description: |
        BYOD (bring-your-own-device) registration / static metadata for an
        instance's backing device, e.g. a user-provided phone.

        Distinct from `ControlInfo` (the `/computer` + `/mobile` live
        control surface): this is the registered hardware snapshot and is
        readable even when the device is offline. `capabilities` here are
        device hardware / Agent-reported capability strings — semantically
        different from `InstanceDataDTO.capabilities` (the instance-level
        capability JSON declaration).
      example:
        metadata:
          key: ""
        capabilities:
        - capabilities
        - capabilities
        os: os
        osVersion: osVersion
        density: 1
        width: 0
        model: model
        type: type
        height: 6
      properties:
        type:
          description: "Device type (e.g. `android`, `windows`, `linux`, `macos`)."
          type: string
        model:
          description: Device model / hardware name.
          type: string
        os:
          description: Operating system name.
          type: string
        osVersion:
          description: Operating system version.
          type: string
        width:
          description: Registered screen width in device pixels.
          format: int32
          type: integer
        height:
          description: Registered screen height in device pixels.
          format: int32
          type: integer
        density:
          description: Registered screen density (DPI).
          format: int32
          type: integer
        capabilities:
          description: |
            Device hardware / Agent-reported capability strings. Semantically
            different from `InstanceDataDTO.capabilities` (an instance-level
            capability JSON object).
          items:
            type: string
          type: array
        metadata:
          additionalProperties: true
          description: |
            Optional caller-/device-supplied extra metadata (raw JSON
            object). Omitted entirely when absent or malformed.
          type: object
      required:
      - capabilities
      - density
      - height
      - model
      - os
      - osVersion
      - type
      - width
      title: DeviceInfoDTO
    ScreenshotResult:
      description: |
